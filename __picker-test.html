<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Item picker test</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <main class="main" style="padding:24px;max-width:900px;margin:0 auto">
    <h1>Item picker test</h1>
    <section class="card">
      <div class="items-editor">
        <div class="items-editor__head"><span>Item</span><span>Qty</span><span>Unit price</span><span></span></div>
        <div id="items-body"></div>
        <button class="btn btn--sm btn--ghost" type="button" id="add-line">Add line</button>
      </div>
    </section>
    <pre id="log" style="margin-top:20px;white-space:pre-wrap"></pre>
  </main>
  <script type="module">
    import { itemPickerHTML, wireItemPicker } from './js/item-picker.js';

    const products = [
      { id: 'p1', name: 'Triple Delight Cake Slice', category: 'Cake Slices', flavour: 'Triple Delight', price: 6000, stock_qty: 4, track_stock: true, image_url: '' },
      { id: 'p2', name: 'Chocolate Fudge Cake Slice', category: 'Cake Slices', flavour: 'Chocolate Fudge', price: 6000, stock_qty: 0, track_stock: true, image_url: '' },
      { id: 'p3', name: 'Coconut Milk Cake', category: 'Milk Cakes', flavour: 'Coconut', price: 4500, stock_qty: 5, track_stock: true, image_url: '' },
      { id: 'p4', name: 'Vanilla Rush Whole Cake', category: 'Budget Cakes', flavour: null, size: 'Varies by size / layers', price: 45000, stock_qty: 0, track_stock: false, image_url: '' },
      { id: 'p5', name: 'Classic Banana Bread', category: 'Banana Bread', flavour: 'Classic', price: 2500, stock_qty: 4, track_stock: true, image_url: '' },
    ];

    const lines = [{ product_id: null, item_name: '', qty: 1, unit_price: 0 }];
    const body = document.querySelector('#items-body');
    const log = document.querySelector('#log');

    function readLines() {
      return [...body.querySelectorAll('.item-row')].map((row, i) => ({
        product_id: row.querySelector('[data-f="product_id"]').value || null,
        item_name: row.querySelector('[data-f="item_name"]').value.trim(),
        qty: Number(row.querySelector('[data-f="qty"]').value || 0),
        unit_price: Number(row.querySelector('[data-f="unit_price"]').value || 0),
      }));
    }

    function draw() {
      body.innerHTML = lines.map((line, i) => `<div class="item-row" data-i="${i}">
        <div class="item-row__name">${itemPickerHTML(line, products)}</div>
        <input type="number" data-f="qty" min="0.01" step="any" value="${line.qty}" aria-label="Quantity">
        <div class="input-prefix"><span>₦</span><input type="number" data-f="unit_price" min="0" step="0.01" value="${line.unit_price}" aria-label="Unit price"></div>
        <button class="icon-btn icon-btn--danger" type="button" data-remove="${i}" title="Remove">Remove</button>
      </div>`).join('');
      log.textContent = JSON.stringify(readLines(), null, 2);
    }

    wireItemPicker(body, products, {
      onSelect: (product) => { log.textContent = `selected: ${product.name}\n${JSON.stringify(readLines(), null, 2)}`; },
      onInput: () => { log.textContent = JSON.stringify(readLines(), null, 2); },
    });

    body.addEventListener('click', (event) => {
      const remove = event.target.closest('[data-remove]');
      if (remove) { lines.splice(Number(remove.dataset.remove), 1); draw(); }
    });
    body.addEventListener('input', (event) => {
      if (event.target.dataset.f === 'qty' || event.target.dataset.f === 'unit_price') log.textContent = JSON.stringify(readLines(), null, 2);
    });
    document.querySelector('#add-line').onclick = () => { lines.push({ product_id: null, item_name: '', qty: 1, unit_price: 0 }); draw(); };

    draw();
  </script>
</body>
</html>
